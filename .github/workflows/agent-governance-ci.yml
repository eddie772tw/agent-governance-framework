name: Agent Governance & Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Agent Governance Audit
        run: |
          python scripts/run_governance_audit.py

      - name: Run Unit Tests
        run: |
          pytest tests/ -v
